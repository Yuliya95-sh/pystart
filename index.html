<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyStart — Python для ЕНТ</title>
  <meta name="description" content="Интерактивный курс Python для подготовки к ЕНТ по информатике: теория, песочница, автопроверка задач и тесты.">

  <!-- Применяем тему до отрисовки, чтобы не было «вспышки» -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pystart.theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CodeMirror 5: редактор с подсветкой Python -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>

  <link rel="stylesheet" href="style.css?v=20261116b">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-logo">Py</span>
      <span class="brand-name">PyStart <small>Python для ЕНТ</small></span>
    </a>
    <div class="topbar-right">
      <span class="py-status" id="pyStatus" title="Состояние интерпретатора Python">
        <span class="dot"></span><span class="label">Python загружается…</span>
      </span>
      <a class="btn btn-ghost hide-mobile" href="#/sandbox">Песочница</a>
      <button class="icon-btn" id="themeBtn" aria-label="Сменить тему" title="Светлая / тёмная тема">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Навигация по курсу"></aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="content" id="app" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="extra_tasks_2.js?v=20261116b"></script>
  <script src="extra_tasks_3.js?v=20261116b"></script>

  <script src="extra_tasks_5.js?v=20261116b"></script>
  <script src="app.js?v=20261116b"></script>
</body>
</html>
